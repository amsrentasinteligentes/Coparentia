  - contentinfo [ref=f17e221]: "Réplica fiel (16 → REFERENCIA = CONTRATO): el estilo se copia, no se mejora ni se reinterpreta; se extiende solo donde la referencia no muestra algo, con su mismo sistema. Diferencias deliberadas: el contenido (Coparentia no tiene mensajes ni entregas; sí cuota, comprobantes, Sello y asistencia jurídica) y la tipografía (la de la página de ventas, para una sola identidad). Marcador data-kit=\"abc-v2\" intacto. Tras la aprobación, la FICHA-ARTE cambia de modo oscuro a claro para toda la app."