  - contentinfo [ref=f1e345]: "Cómo se hizo: tres interpretaciones fieles de las referencias que compartiste (2houses, Niddo, OurFamilyWizard), todas en claro y con el azul Coparentia en sectores. Divergen en tipo de letra (elegante / rotunda / redondeada), composición (collage editorial / título enorme con teléfonos / formas orgánicas), paleta real y detalle propio. Las capturas de la app son reales; las fotos son marcadores de posición hasta elegir las definitivas con licencia. El interior de la app no cambia. Marcador del kit data-kit=\"abc-v2\" intacto (Regla Dura #0)."